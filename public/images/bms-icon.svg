<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Battery Outer Body -->
  <rect x="15" y="25" width="65" height="50" rx="8" fill="none" stroke="#10b981" stroke-width="4" filter="url(#glow)"/>
  <!-- Terminal Cap -->
  <rect x="80" y="40" width="7" height="20" rx="2" fill="#10b981" />
  <!-- Energy Levels -->
  <rect x="22" y="32" width="14" height="36" rx="3" fill="url(#batteryGrad)" />
  <rect x="39" y="32" width="14" height="36" rx="3" fill="url(#batteryGrad)" />
  <rect x="56" y="32" width="14" height="36" rx="3" fill="url(#batteryGrad)" />
  <!-- Lightning Bolt -->
  <polygon points="50,15 36,46 47,46 43,65 62,38 51,38" fill="#ffffff" opacity="0.95" />
</svg>
